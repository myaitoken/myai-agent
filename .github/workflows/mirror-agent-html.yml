# Mirrors browser/agent.html from this repo into Infinihash/infinihash-web@master
# and triggers the production deploy. Runs only when the file changes on main.
#
# Required repo secrets:
#   INFINIHASH_WEB_PAT     PAT with `repo` scope on Infinihash/infinihash-web
#   INFRA_GATEWAY_TOKEN    Bearer token for https://gateway.infinihash.com
name: mirror agent.html
on:
  push:
    branches: [main]
    paths: ['browser/agent.html', 'browser/sw.js']
  workflow_dispatch: {}

concurrency:
  group: mirror-agent-html
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (myai-agent)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout target (infinihash-web)
        uses: actions/checkout@v4
        with:
          repository: Infinihash/infinihash-web
          ref: master
          token: ${{ secrets.INFINIHASH_WEB_PAT }}
          path: target

      - name: Copy + commit
        id: commit
        run: |
          cp src/browser/agent.html target/agent.html
          cp src/browser/sw.js      target/sw.js
          cd target
          git config user.name  "myai-agent mirror bot"
          git config user.email "ci@infinihash.com"
          # Stage first, then check the staged diff — `git diff` (unstaged) does
          # NOT detect newly-created files like a first-time sw.js, which would
          # make a real change look like "no change" and skip the deploy.
          git add agent.html sw.js
          if git diff --cached --quiet -- agent.html sw.js; then
            echo "no change in agent.html / sw.js — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "mirror(agent.html,sw.js): from myaitoken/myai-agent@${GITHUB_SHA::7}"
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS --fail --max-time 180 -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_GATEWAY_TOKEN }}" \
            https://gateway.infinihash.com/deploy/infinihash-web
